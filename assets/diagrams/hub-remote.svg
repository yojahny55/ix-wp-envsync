<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Helvetica,Arial,sans-serif"><rect width="100%" height="100%" rx="16" fill="#f8fafc"/><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#38bdf8"/></marker><marker id="b" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#94a3b8"/></marker></defs>
<rect x="20" y="40" width="310" height="220" rx="16" fill="#0f172a"/><text x="175" y="88" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">Your laptop (hub)</text><text x="175" y="132" text-anchor="middle" font-size="16" fill="#94a3b8">WordPress + WP-CLI</text><text x="175" y="160" text-anchor="middle" font-size="16" fill="#94a3b8">runs the commands</text><text x="175" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#38bdf8">holds the token</text><text x="175" y="230" text-anchor="middle" font-size="15" fill="#94a3b8">and the last-pull baseline</text>
<rect x="630" y="40" width="310" height="220" rx="16" fill="#0f172a"/><text x="785" y="88" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">Client hosting (remote)</text><text x="785" y="132" text-anchor="middle" font-size="16" fill="#94a3b8">WordPress + IX WP EnvSync</text><text x="785" y="160" text-anchor="middle" font-size="16" fill="#94a3b8">answers over REST</text><text x="785" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#38bdf8">checks the signature</text><text x="785" y="230" text-anchor="middle" font-size="15" fill="#94a3b8">keeps a snapshot to roll back</text>
<path d="M622 108H338" stroke="#94a3b8" stroke-width="4" marker-end="url(#b)"/><text x="480" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">pull</text><text x="480" y="130" text-anchor="middle" font-size="14" fill="#64748b">a full copy comes down</text>
<path d="M338 182H622" stroke="#38bdf8" stroke-width="4" marker-end="url(#a)"/><text x="480" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#0369a1">push</text><text x="480" y="204" text-anchor="middle" font-size="14" fill="#64748b">only your changes go up</text>
<text x="480" y="244" text-anchor="middle" font-size="14" fill="#64748b">signed requests · the token never travels</text></svg>
