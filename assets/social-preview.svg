<text x="420" y="270" font-family="Helvetica,Arial,sans-serif" font-size="104" font-weight="700" fill="#f8fafc">EnvSync</text>
<text x="424" y="338" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#94a3b8">Sync WordPress between local, staging and prod.</text>
<text x="424" y="396" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#38bdf8">Push only what you changed. Prod always wins.</text>
